<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="../style/cadastro.css" />

    <title>Cadastro - Kallia</title>
  </head>

  <body>
    <header>
      <h1>Faça seu cadastro</h1>
    </header>

    <div class="container-fluid">
      <form action="" class="">
        <div class="row">
          <div class="col-md-5 col-md-offset-0">
            <label for="">Nome</label>
            <input type="text" class="form-control" name="nome" required />
          </div>
          <div class="col-md-3">
            <label for="">Telefone</label>
            <input type="text" class="form-control" name="telefone" required />
          </div>
          <div class="col-md-4">
            <label for="">E-mail</label>
            <input type="email" class="form-control" name="email" required />
          </div>
        </div>

        <hr style="border: solid 2px black" />

        <div class="row">
          <div class="col-md-2">
            <label for="">CEP</label>
            <input type="text" class="form-control" name="cep" />
          </div>

          <div class="col-md-5">
            <label for="">Endereço</label>
            <input type="text" class="form-control" name="endereco" />
          </div>

          <div class="col-md-2">
            <label for="">Número</label>
            <input type="text" class="form-control" name="numero" />
          </div>

          <div class="col-md-3">
            <label for="">Cidade</label>
            <input type="text" class="form-control" name="cidade" />
          </div>
        </div>

        <br />

        <div class="row">
          <div class="col-md-4">
            <label for="">Estado</label>

            <select class="form-control" name="estado">
              <option value="">São Paulo</option>
              <option value="">Minas Gerais</option>
              <option value="">Rio de Janeiro</option>
              <option value="">Paraná</option>
              <option value="">Outro</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="">Data de Cadastro</label>
            <input type="date" class="form-control" name="dataCadastro" />
          </div>
        </div>

        <hr />

        <div class="row">
          <div class="col-md-4">
            <label for="">Ambiente</label>

            <select class="form-control" name="ambiente">
              <option value="">Cozinha</option>
              <option value="">Área Gourmet</option>
              <option value="">Dormitório</option>
              <option value="">Sala</option>
              <option value="">Home Office</option>
              <option value="">Outro</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="">Tipo de projeto</label>

            <select class="form-control" name="projeto">
              <option value="">Móveis planejados</option>
              <option value="">Interiores</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="">Data prevista para o projeto</label>
            <input type="date" class="form-control" name="dataProjeto" />
          </div>
        </div>

        <br />

        <div class="row">
          <div class="col-md-5">
            <label>Estilo desejado</label>

            <label>
              <input type="radio" value="moderno" name="estilo" checked />
              Moderno
            </label>

            <label>
              <input type="radio" value="contemporaneo" name="estilo" />
              Contemporâneo
            </label>

            <label>
              <input type="radio" value="classico" name="estilo" />
              Clássico
            </label>
          </div>
        </div>

        <hr />

        <div class="row">
          <div class="col-md-8">
            <label for="">Observações sobre o projeto</label>

            <textarea
              class="form-control"
              name="observacoes"
              rows="5"
              placeholder="Conte um pouco sobre o projeto que você deseja realizar..."
            >
            </textarea>
          </div>
        </div>

        <br />

        <button type="button" class="btn btn-outline-dark">Gravar</button>

        <button type="button" class="btn btn-dark">Cancelar</button>

        <button type="reset" class="btn btn-dark">Corrigir</button>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64/2LcCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
